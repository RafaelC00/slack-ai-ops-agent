[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-ai-ops-agent"
version = "0.1.0"
description = "Production RAG agent with evals, reachable from Slack. Marketing-ops assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "slack-sdk>=3.33",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8.3"]

[tool.setuptools]
# Only the app package ships; evals/ and scripts/ are run as scripts, tests/ is
# test-only. Explicit list so setuptools doesn't choke on the sibling dirs.
packages = ["app", "app.agent", "app.rag", "app.slack"]

[tool.ruff]
line-length = 100
