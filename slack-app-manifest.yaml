# Slack app manifest for slack-ai-ops-agent.
#
# Create: https://api.slack.com/apps -> "Create New App" -> "From an app manifest"
#   -> pick your personal/throwaway workspace -> paste this YAML -> Create.
# Then: "Install to Workspace" to mint the Bot User OAuth Token (xoxb-...).
#   Signing Secret is under "Basic Information" -> "App Credentials".
#
# Event Subscriptions are intentionally omitted here: Slack verifies the
# request_url the moment you save it, so it only works once the app is deployed
# and reachable. Add them AFTER the Vercel deploy:
#   Event Subscriptions -> Enable -> Request URL: https://<deploy-host>/slack/events
#   Subscribe to bot events: app_mention, message.im   (then reinstall)

display_information:
  name: AI Ops Agent
  description: RAG marketing-ops assistant with a published eval suite
  background_color: "#4a154b"

features:
  bot_user:
    display_name: ai-ops-agent
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
